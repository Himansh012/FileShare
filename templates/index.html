<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/style.css') }}">
</head>
<body>
    <div class="container">
    
        <div class="app-header">
    
    
            <h1>FileShare</h1>
        
    </div>

    <div class="file-section">
        <h2>Uploaded files </h2>
        {% if files %}

            {% for file in files %}
                <div class="file-list">
                <a href="{{url_for('download', filename=file.stored_name)}}">
                    {{file.original_name}}
                </a>
                <form class="delete-form"
                action="{{url_for('delete', filename = file.stored_name)}}" 
                method="POST">

                <button type="submit">
                    Delete
                </button>

            </form>
        </div>
                {% endfor %}
        </div>

            {% else %}

        <p>No files uploaded yet.</p>

        {% endif %}

    </div>
    
    <div class="upload-section">
        
        <h2>Upload File</h2>

        <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" id="uploaded-form">
            
            <input 
            id="file-input"
            type="file" 
            name="file"
            multiple>    
            <button type="submit">Upload</button>    
    
        </form>
    </div>
    
</div>
</body>
</html>
