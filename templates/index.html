<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare</title>
    <link rel="stylesheet" href="static\css\style.css">
</head>
<body>
    <h1>FileShare</h1>
    <br><br>
    <p>Uploaded files: </p>
    <ul>
        {% for file in files %}
        <li>
            <form action="/delete/{{file.stored_name}}" method="POST" class="delete-form">
            <a href="{{url_for('download', filename=file.stored_name)}}">
                {{file.original_name}}
            </a>
            <button type="submit">Delete</button>
            </form>
            
        </li>
        {% endfor %}
    </ul>

    <form action="/upload" method="POST" enctype="multipart/form-data" id="uploaded-files">
        <label for="file">Upload your file: </label>
        <br><br>
        <input type="file" name="file" multiple>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
