<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Successful</title>
</head>
<body>
    <h4>Success !!</h4>
    <p>Your file(s)</p>
        <ul>
         {% for file in uploaded_files %}
         <li>{{file}}</li>
         {% endfor %}
        </ul>
        <p>were uploaded Successfully.</p>
        <br><br>
        {% if failed_filenames %}
    <h4>These files failed.</h4>
    <ul>
        {% for file in failed_filenames %}
        <li>{{file}}</li>
        {% endfor %} 
    </ul>
    {% endif %}
    <a href="{{url_for('home')}}">Home Page</a>
</body>
</html>
